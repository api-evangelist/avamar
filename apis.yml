name: Avamar
description: 'Avamar is enterprise backup and recovery software built on client-side global data deduplication,
  founded in Irvine, California and backed by Lightspeed Venture Partners before EMC acquired the company
  in November 2006 for approximately $165 million. Avamar now ships as Dell Avamar, part of the Dell Technologies
  data protection portfolio, and is deployed as a customer-hosted appliance or virtual edition rather
  than as a public SaaS. It exposes a REST API on the Avamar server for programmatic backup, restore,
  client, domain, dataset, policy and activity management, secured with OAuth 2.0 access tokens and
  optional OIDC single sign-on, and documented through a Swagger UI served from the appliance itself.
  A first-party Management Console Command Line Interface (mccli) and the avtar/avmaint command set
  provide the scripted administrative surface alongside the API.'
