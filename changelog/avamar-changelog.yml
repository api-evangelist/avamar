- version: '19.10'
  date: '2024-01'
  revised: '2024-02'
  revision: A01
  url: https://www.dell.com/support/manuals/en-us/avamar-server/avamar_release_notes_19.10/new-features-and-changes
  breaking: false
  additions:
  - AUI - information button in the Replace Private Entry wizard explaining Private Key, Certificate
    and chain of trusted root certificates.
  - AUI - Korean language support.
  - AUI - new Backup Lock, Backup Lock Expiry Date and Immutable Backup Configuration columns in the
    backup list pane.
  - AUI - add and update SMTP mail server details from the Settings window.
  - Avamar Server - new "[avtar]repl-metadata-only" option to replicate metadata only.
  - Avamar Server - new "[replscript]copyuser" option controlling whether source-system user accounts
    are copied to the REPLICATE domain of the destination system (default true).
  - Avamar Server - Data Domain Retention Lock (DDRL) support in governance mode, including period
    lock and a "No end date" option in retention policy settings.
