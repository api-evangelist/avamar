standards:
- id: oauth2
  conforms: true
  evidence: >-
    Documented OAuth 2.0 client registration (POST /api/v1/oauth2/clients) and token endpoint (POST
    /api/oauth/token) with password and client_credentials grants, bearer tokens and refresh tokens.
  source: https://www.dell.com/support/manuals/en-us/avamar-server/avamar_administration_guide_19.10/avamar-rest-api
- id: rfc6749-oauth2-password-grant
  conforms: true
  evidence: grant_type=password with client credentials sent as HTTP Basic on the token endpoint.
- id: oidc
  conforms: true
  evidence: >-
    OIDC single sign-on for the Avamar Web UI validated against Keycloak realms, with an OIDC client
    registration carrying token_endpoint_auth_method client_secret_basic, id_token_signed_response_alg
    RS256, and the openid/profile scopes.
- id: rfc7519-jwt
  conforms: true
  evidence: Access tokens are returned as RS256-signed JWTs with a jti claim.
- id: openapi-swagger-2.0
  conforms: partial
  evidence: >-
    A Swagger UI describing the complete Avamar REST API operation and object-model surface is served
    from the appliance at /api/swagger-ui.html, and the sibling OpenStack Data Protection Extension
    API is defined by a YAML file following OpenAPI Specification 2.0. Dell does not publish a
    downloadable Avamar specification document, so the definition is only reachable per-deployment.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Error responses use a proprietary `message` element and numeric Avamar event codes; no
    application/problem+json contract is documented.
- id: rfc8594-sunset-header
  conforms: false
  evidence: No Sunset or Deprecation response headers documented; deprecation is published as EOL/EOSL notices.
- id: json-api
