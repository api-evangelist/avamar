retryable_error_class:
  setting: move.queue.error.codes
  detail: >-
    Avamar Client Manager treats a specific set of numeric error codes as retryable for client move
    tasks — a failed move is queued for retry only when its failure produces one of these codes. The
    default list is the closest thing Dell publishes to a machine-readable transient-error class.
  default_codes:
  - 22271
  - 22280
  - 22282
  - 22295
  - 30006
  - 30012
  - 30016
  - 30017
  - 30019
  special_values:
    none: never queue a failed move task for retry
    empty: queue every failed move task for retry
  retry_policy:
    move_retry_attempts: 24
    move_retry_frequency_minutes: 120
  source: Avamar 19.10 Administration Guide, Avamar Client Manager configuration
