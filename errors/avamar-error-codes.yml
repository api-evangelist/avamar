note: >-
  Avamar layers two distinct error surfaces: HTTP-level errors returned by the REST API, and numeric
  Avamar event/error codes attached to backup, restore and move activities. The authoritative numeric
  registry is not published as a single machine-readable file — Dell distributes it as KB articles and
  ships the complete catalog on the appliance itself. Only entries verified in Dell documentation are
  recorded below; the numeric catalog is referenced rather than reproduced.
api_error_envelope:
  transport: HTTP status code
  body_field: message
  media_types:
  - application/json
  - application/xml
  detail: >-
    For a synchronous call the HTTP response code indicates the operation's final status; when the
    operation fails the response body includes a `message` element describing the reason. For an
    asynchronous call the failure surfaces on the task resource as a terminal `state` of ERROR,
    CANCELED or ABORTED.
  troubleshooting: >-
    Dell's documented failure-triage procedure is to examine the HTTP status code returned by the
    Avamar REST API server and then examine the Avamar REST API log.
async_failure_states:
- state: ERROR
  meaning: The asynchronous operation failed.
- state: CANCELED
  meaning: The asynchronous operation was canceled before completion.
- state: ABORTED
  meaning: The asynchronous operation was aborted.
